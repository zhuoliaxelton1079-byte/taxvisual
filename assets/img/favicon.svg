<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TaxVisual">
  <title>TaxVisual</title>
  <!--
    The same mark as logo.svg, knocked out of a filled tile so it holds up
    against browser-tab chrome. A favicon cannot inherit the page's colors,
    so the two theme pairs are written out here. Both are taken straight
    from tokens.css, and both are already verified for contrast there:

      light   tile = accent #0f5e52   mark = paper #fbfaf8   (7.7:1)
      dark    tile = accent #4fb3a1   mark = page  #14130f   (7.3:1)

    Modern browsers honour prefers-color-scheme inside an SVG favicon; the
    ones that do not fall back to the light pair, which is the safe default
    against the usual light tab strip.

    Note: an XML comment may not contain a doubled hyphen, so the CSS
    custom-property names are written without their leading dashes above.
    Spelling them out invalidates the file and the icon silently vanishes.
  -->
  <style>
    .tile { fill: #0f5e52 }
    .mark { fill: #fbfaf8 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #4fb3a1 }
      .mark { fill: #14130f }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <g class="mark" transform="translate(8 7.2) scale(2)">
    <rect x="2" y="20" width="20" height="1.3" rx=".65"/>
    <path d="M2 20V14.7Q2 13.2 3.5 13.2H5.5Q7 13.2 7 14.7V20Z"/>
    <path d="M9.5 20V10.1Q9.5 8.6 11 8.6H13Q14.5 8.6 14.5 10.1V20Z"/>
    <rect x="17" y="9.3" width="5" height="10.7"/>
    <path d="M17 8.7V5Q17 3.5 18.5 3.5H20.5Q22 3.5 22 5V8.7Z" fill-opacity=".45"/>
  </g>
</svg>
