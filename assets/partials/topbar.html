<!--
  Reference copy only — never fetched at runtime. When the nav changes,
  update this file, then hand-copy the change into every page's own
  <header class="topbar"> block.

  Two things to substitute when you paste it:

  1. {{ROOT}} — the relative prefix for that page's depth:
       ''       at the repo root (index.html)
       '../'    one level deep (tools/, learn/, dashboard/, about/, …)
       '../../' two levels deep (tools/<slug>/, review/<page>/, …)

  2. The current-page marker. Put aria-current="page" on the link that
     points at the page you are pasting into, and aria-current="true" on
     the section link when the current page sits *inside* that section but
     is not the section index — e.g. on tools/tax-bracket-ledger/ the
     "Tools" link gets aria-current="true". Remove it from all others.
     Pasting this file verbatim would drop the marker, which loses both
     the screen-reader cue and the underline that styles it.

  Two sections live at a folder that is not named after the tab, because
  the tab was renamed after the pages were built and the URLs were kept:
     Tools      → /tools/, and /review/* sits under it — the 1040 preview
                  is a tab on the Tools page, so the whole return-review
                  section marks Tools rather than Dashboard
     Consulting → /consulting/, and /training/* sits under it
  Pages in those folders take aria-current="true" on the tab above them.
  /dashboard/ is a single page now (the IRS SOI explorer) and owns nothing
  below it.
-->
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{{ROOT}}index.html" aria-label="TaxVisual home">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="20" width="20" height="1.3" rx=".65"/><path d="M2 20V14.7Q2 13.2 3.5 13.2H5.5Q7 13.2 7 14.7V20Z"/><path d="M9.5 20V10.1Q9.5 8.6 11 8.6H13Q14.5 8.6 14.5 10.1V20Z"/><rect x="17" y="9.3" width="5" height="10.7"/><path d="M17 8.7V5Q17 3.5 18.5 3.5H20.5Q22 3.5 22 5V8.7Z" fill-opacity=".45"/></svg>
      <span>TaxVisual</span>
    </a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="{{ROOT}}learn/index.html">Learn</a></li>
        <li><a href="{{ROOT}}tools/index.html">Tools</a></li>
        <li><a href="{{ROOT}}dashboard/index.html">Dashboard</a></li>
        <li><a href="{{ROOT}}consulting/index.html">Consulting</a></li>
        <li><a href="{{ROOT}}about/index.html">About</a></li>
      </ul>
    </nav>
  </div>
</header>
