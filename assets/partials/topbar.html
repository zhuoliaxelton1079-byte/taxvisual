<!--
  Reference copy only — never fetched at runtime. When the nav changes,
  update this file, then hand-copy the change into every page's own
  <header class="topbar"> block.

  Two things to substitute when you paste it:

  1. {{ROOT}} — the relative prefix for that page's depth:
       ''       at the repo root (index.html)
       '../'    one level deep (tools/, learn/, training/, about/, …)
       '../../' two levels deep (tools/<slug>/, learn/<page>/, …)

  2. The current-page marker. Put aria-current="page" on the link that
     points at the page you are pasting into, and aria-current="true" on
     the section link when the current page sits *inside* that section but
     is not the section index — e.g. on tools/tax-bracket-ledger/ the
     "Tools" link gets aria-current="true". Remove it from all others.
     Pasting this file verbatim would drop the marker, which loses both
     the screen-reader cue and the underline that styles it.
-->
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{{ROOT}}index.html" aria-label="TaxVisual home">
      <span class="brand-mark">TV</span>
      <span>TaxVisual</span>
    </a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="{{ROOT}}tools/index.html">Tools</a></li>
        <li><a href="{{ROOT}}learn/index.html">Learn</a></li>
        <li><a href="{{ROOT}}training/index.html">Training</a></li>
        <li><a href="{{ROOT}}about/index.html">About</a></li>
        <li><a class="topbar-cta" href="{{ROOT}}contact/index.html">Request training</a></li>
      </ul>
    </nav>
  </div>
</header>
