<!--
  Reference copy only — never fetched at runtime. When the nav changes,
  update this file, then hand-copy the change into every page's own
  <header class="topbar"> block.

  Two things to substitute when you paste it:

  1. {{ROOT}} — the relative prefix for that page's depth:
       ''       at the repo root (index.html)
       '../'    one level deep (about/, directory/, methodology/, sitemap/)
       '../../' under tools/<slug>/

  2. aria-current="page" — put it on the link (or the brand, on the
     homepage) that points at the page you are pasting into, and remove it
     from all the others. Pasting this file verbatim would drop it, which
     both removes the current-page cue for screen readers and loses the
     underline that styles it.
-->
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{{ROOT}}index.html" aria-label="TaxVisual home">
      <span class="brand-mark">TV</span>
      <span>TaxVisual</span>
    </a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="{{ROOT}}directory/index.html">Tools</a></li>
        <li><a href="{{ROOT}}methodology/index.html">Methodology</a></li>
        <li><a href="{{ROOT}}about/index.html">About</a></li>
      </ul>
    </nav>
  </div>
</header>
