<!--
  Reference copy only — never fetched at runtime. When the nav changes,
  update this file, then copy the change into every page's own
  <header class="topbar"> block.

  {{ROOT}} is the relative prefix for that page's depth: '' at the repo
  root, '../' one level deep, '../../' two levels deep.

  Put aria-current="page" on the tab whose index you are on, and
  aria-current="true" on the tab above any other page in its section.

  Three tabs own folders that are not named after them:
     Samples   → /samples/, and /review/* (the sample return walkthrough)
     Resources → /resources/, /dashboard/ and /learn/*
  /consulting/, /training/*, /learn/, /learn/textbook/ and /community/ are
  redirect stubs to their replacements and carry no chrome.
-->
<header class="topbar">
    <div class="container topbar-inner">
      <a class="brand brand--wordmark" href="{{ROOT}}index.html" aria-label="TaxVisual home">
        <img class="brand-logo" src="{{ROOT}}assets/img/taxvisual-logo-deep-teal.png" alt="TaxVisual" width="2172" height="724" decoding="async">
      </a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="{{ROOT}}services/index.html">Services</a></li>
          <li><a href="{{ROOT}}samples/index.html">Samples</a></li>
          <li><a href="{{ROOT}}tools/index.html">Tools</a></li>
          <li><a href="{{ROOT}}resources/index.html">Resources</a></li>
          <li><a href="{{ROOT}}about/index.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>
